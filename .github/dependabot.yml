# Weekly update checks; security updates open as soon as an advisory is
# published. The time frames for acting on them are in SECURITY.md.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # The plan pins Django 5.2 (an LTS). Patch and minor security releases
      # still come through; a major upgrade is a decision, not a bump.
      - dependency-name: django
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
