openapi: 3.0.3
info:
  title: Super Notes API
  version: 1.0.0
  description: 'Notes that sync across devices, and answers to questions about them
    with citations. Sign in with `POST /api/v1/auth/google/` and send `Authorization:
    Bearer <access>`.'
paths:
  /api/v1/app/version/:
    get:
      operationId: app_version_retrieve
      description: Build ids look like `YYYYMMDDHHMM-<shortsha>` and compare by their
        timestamp prefix.
      summary: Client app version
      tags:
      - Health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppVersion'
          description: ''
  /api/v1/ask/:
    get:
      operationId: ask_list
      description: Conversation turns included, except those of deleted conversations.
        Follow `next` for more.
      summary: Your asks, newest first
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: query
        name: page_size
        schema:
          type: integer
        description: 1-100, default 25.
      tags:
      - Ask
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAskQueryList'
          description: ''
    post:
      operationId: ask_create
      description: |-
        Starts answering and returns at once with the ask `pending` (202): poll `GET ask/<id>/` until `status` is `done` or `failed`. The answer comes from your notes only, with `[n]` markers matching `citations`.

        Send a fresh `Idempotency-Key` per question. Resending one (a retry after a dropped connection) returns the ask it already made, with 200, and does not count again. Reusing it for a different question, or one first sent as a conversation turn, is a 422.

        Each ask that does not fail counts against the month's quota (see `me/`). When the service-wide monthly budget is used up, asking pauses for everyone: 503 `system_limit_reached`.
      summary: Ask your notes a question
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: 1-100 of `A-Z a-z 0-9 - _`; a UUID is ideal.
        required: true
      tags:
      - Ask
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AskCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AskCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AskCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AskQuery'
          description: Asked; poll for the answer.
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AskQuery'
          description: 'A replayed key: that ask.'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: Invalid question, or `idempotency_key_required` / `idempotency_key_invalid`.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: Not signed in.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: '`idempotency_key_reused`: the key was used for another question,
            or for an ask somewhere else (a plain ask, another conversation).'
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotaExceeded'
          description: '`quota_exceeded` (with usage), or `throttled`.'
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: '`system_limit_reached`: this feature is paused for everyone
            (a system-wide limit). Not the caller''s own quota; try again later.'
  /api/v1/ask/{id}/:
    get:
      operationId: ask_retrieve
      description: Poll this until `status` is `done` or `failed`; a failed ask has
        a user-facing `error` and does not count against the quota. Conversation turns
        are polled here too.
      summary: Get an ask
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Ask
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AskQuery'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: Not signed in.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: No such ask of yours.
  /api/v1/ask/{id}/stream/:
    get:
      operationId: ask_stream_retrieve
      description: |-
        The answer as it is written, as server-sent events (`text/event-stream`). Read it with
        `fetch` and a streaming body reader (an `EventSource` cannot send the `Authorization` header).
        Polling `GET ask/<id>/` keeps working and stays the source of truth: on any error, or a stream
        that ends without `done` or `failed`, poll (or open the stream again: it catches up).

        Each event is `event: <type>` and one `data:` line of JSON that repeats `type`:

        - `snapshot` `{text, offset}`: the answer so far; replaces what you have. `offset` is its
          length. First, for an unfinished ask.
        - `delta` `{offset, text}`: append `text`. Deltas are contiguous: `offset` is always the length
          of the text so far (in code points).
        - `reset`: the answer is starting over (a retry); clear the text.
        - `done` / `failed` `{ask}`: the ask exactly as `GET ask/<id>/` returns it, citations
          included. Last.
        - `timeout`: the stream reached its time limit (5 minutes by default). Last: poll.
        - `unavailable`: live events are off or unreachable, or the server is not running under ASGI.
          Last: poll.

        A finished ask gets its `done` or `failed` at once. A `: keep-alive` comment line comes after
        15 seconds without an event. Opening a stream counts against the general request rate, not the
        `ask` scope.
      summary: Stream an ask's answer
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Ask
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            text/event-stream:
              schema:
                type: string
          description: Server-sent events until the ask ends.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: Not signed in.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: No such ask of yours.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: '`throttled`.'
  /api/v1/attachments/{id}/:
    get:
      operationId: attachments_retrieve
      summary: Get an attachment's metadata
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - Attachments
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: No such attachment of yours.
    delete:
      operationId: attachments_destroy
      description: Frees its storage and deletes the file. Its note is sent again
        by `notes/changes/` without it.
      summary: Delete an attachment
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - Attachments
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: No such attachment of yours.
  /api/v1/attachments/{id}/file/:
    get:
      operationId: attachments_file_retrieve
      description: 'The file''s bytes, as a download (`Content-Disposition: attachment`)
        with its sniffed type.'
      summary: Download an attachment
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - Attachments
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
          description: The file.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: No such attachment of yours.
  /api/v1/auth/devices/:
    get:
      operationId: auth_devices_list
      description: 'At most `MAX_SIGNED_IN_DEVICES` (default 2): a further sign-in
        signs the least recently used device out. Most recently seen first; a device
        that has gone away (its refresh token expired or was revoked) is not listed.'
      summary: Signed-in devices
      tags:
      - Account
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Device'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: Not signed in.
  /api/v1/auth/devices/{id}/:
    delete:
      operationId: auth_devices_destroy
      description: Revokes that device's refresh token, so its next refresh is a 401.
        Its current access token keeps working until it expires (`JWT_ACCESS_MINUTES`,
        default 30). Another account's device id is 404.
      summary: Sign a device out
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Account
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: Not signed in.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: No such device of yours.
  /api/v1/auth/google/:
    post:
      operationId: auth_google_create
      description: Verifies the ID token (signature, audience = any configured client
        id, expiry, issuer, verified email), finds or creates the account, and returns
        a token pair. Every refusal of the token or the account is the same `google_failed`,
        whatever the cause. A first sign-in when the day's new accounts are used up
        is a 403 `signups_closed`; existing accounts still sign in.
      summary: Sign in with Google
      tags:
      - Account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleLoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GoogleLoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GoogleLoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: Google sign-in failed.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: '`signups_closed`: no new accounts today.'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: Sign-in is not configured.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: Too many, too recently.
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      description: Blacklists this refresh token. The access token beside it keeps
        working until it expires (`JWT_ACCESS_MINUTES`, default 30); a client should
        drop both.
      summary: Log out
      tags:
      - Account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      security:
      - {}
      responses:
        '204':
          description: No response body
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: Invalid or already revoked.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: Too many, too recently.
  /api/v1/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: 'Exchange a refresh token for a new pair. The old refresh token
        is blacklisted at once: presenting it again is a 401. So is a device that
        was signed out -- from the devices list, or by a newer sign-in once the account
        is on `MAX_SIGNED_IN_DEVICES` devices (default 2): sign in again.'
      summary: Refresh tokens
      tags:
      - Account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshedPair'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: Invalid, expired or revoked.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: Too many, too recently.
  /api/v1/conversations/:
    get:
      operationId: conversations_list
      description: Follow `next` for more.
      summary: Your conversations, most recently active first
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: query
        name: page_size
        schema:
          type: integer
        description: 1-100, default 25.
      tags:
      - Conversations
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedConversationList'
          description: ''
    post:
      operationId: conversations_create
      description: 'Without a `question`, makes an empty conversation (201). With
        one, also asks it as turn 1, exactly as `POST conversations/<id>/turns/` would,
        and then needs an `Idempotency-Key`: a retry with the same key returns the
        same conversation (200) and does not count again. Poll the turn with `GET
        ask/<id>/`.'
      summary: Start a conversation
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: Required with a `question`. 1-100 of `A-Z a-z 0-9 - _`.
      tags:
      - Conversations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ConversationCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ConversationCreateRequest'
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationDetail'
          description: Started.
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationDetail'
          description: 'A replayed key: that conversation.'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: Invalid question, or `idempotency_key_required` / `idempotency_key_invalid`.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: Not signed in.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: '`idempotency_key_reused`: the key was used for another question,
            or for an ask somewhere else (a plain ask, another conversation).'
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotaExceeded'
          description: '`quota_exceeded` (with usage), or `throttled`.'
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: '`system_limit_reached`: this feature is paused for everyone
            (a system-wide limit). Not the caller''s own quota; try again later.'
  /api/v1/conversations/{id}/:
    get:
      operationId: conversations_retrieve
      summary: Get a conversation and its turns
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Conversations
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationDetail'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: Not signed in.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: No such conversation of yours (or it was deleted).
    patch:
      operationId: conversations_partial_update
      description: Does not move it in the list, which follows new turns.
      summary: Rename a conversation
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Conversations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedConversationRenameRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedConversationRenameRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedConversationRenameRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: Invalid title.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: Not signed in.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: No such conversation of yours (or it was deleted).
    delete:
      operationId: conversations_destroy
      description: Its turns go from `ask/` too. The asks it used still count this
        month.
      summary: Delete a conversation
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Conversations
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: Not signed in.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: No such conversation of yours (or it was deleted).
  /api/v1/conversations/{id}/turns/:
    post:
      operationId: conversations_turns_create
      description: |-
        `POST ask/`, in a conversation: returns the turn `pending` (202); poll `GET ask/<id>/` until it is `done` or `failed`. Turns are sequential: while the previous turn is pending or running this is a 409 `turn_in_progress`, naming that turn. A replayed `Idempotency-Key` returns its turn (200), even then.

        Each turn counts against the month's asks, as an ask does.
      summary: Ask the next question in a conversation
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: 1-100 of `A-Z a-z 0-9 - _`; a UUID is ideal.
        required: true
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Conversations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AskCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AskCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AskCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AskQuery'
          description: Asked; poll for the answer.
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AskQuery'
          description: 'A replayed key: that turn.'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: Invalid question, or `idempotency_key_required` / `idempotency_key_invalid`.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: Not signed in.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: No such conversation of yours (or it was deleted).
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TurnInProgress'
          description: '`turn_in_progress`: the previous turn has not finished.'
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: '`idempotency_key_reused`: the key was used for another question,
            or for an ask somewhere else (a plain ask, another conversation).'
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotaExceeded'
          description: '`quota_exceeded` (with usage), or `throttled`.'
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: '`system_limit_reached`: this feature is paused for everyone
            (a system-wide limit). Not the caller''s own quota; try again later.'
  /api/v1/format-jobs/{id}/:
    get:
      operationId: format_jobs_retrieve
      description: Poll this until `status` is `done` or `failed`; a failed job has
        an `error_code` and a user-facing `error`, and does not count against the
        limit.
      summary: Get a format job
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Format
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormatJob'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: Not signed in.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: No such job of yours.
  /api/v1/health/:
    get:
      operationId: health_retrieve
      description: |-
        Whether the app is up and can reach its database.

        For an uptime monitor, or a client deciding whether to show "we are
        down". Unauthenticated and unthrottled: a monitor polling once a minute
        would otherwise use up the anonymous rate on its own.
      summary: Health check
      tags:
      - Health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthDown'
          description: ''
  /api/v1/me/:
    get:
      operationId: me_retrieve
      description: The signed-in account.
      summary: Your profile
      tags:
      - Account
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: Not signed in.
    patch:
      operationId: me_partial_update
      description: '`timezone` (an IANA name) and `memory_enabled`. Setting `memory_enabled`
        also records that the user chose it themselves.'
      summary: Update your settings
      tags:
      - Account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMeUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedMeUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedMeUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
        '400':
          description: Invalid timezone.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: Not signed in.
  /api/v1/me/memory-notice/seen/:
    post:
      operationId: me_memory_notice_seen_create
      description: Restarts the count to the next memory notice (D94).
      summary: Memory notice seen
      tags:
      - Account
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: Not signed in.
  /api/v1/me/push-subscriptions/:
    post:
      operationId: me_push_subscriptions_create
      description: Upsert by endpoint. An endpoint registered to another account moves
        to the caller (one browser profile, one owner). 404 when web push is off.
      summary: Register a push subscription
      tags:
      - Account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushSubscriptionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PushSubscriptionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PushSubscriptionRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: Invalid subscription.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: Not signed in.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: Web push is off.
    delete:
      operationId: me_push_subscriptions_destroy
      description: 'By endpoint, among the caller''s own. Removing one that is not
        there (or is another account''s) is still 204: nothing to remove.'
      summary: Remove a push subscription
      tags:
      - Account
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: Invalid request.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: Not signed in.
  /api/v1/notes/:
    get:
      operationId: notes_list
      description: Deleted notes are left out. `q` is a keyword search over the title
        and body (whole words and their stems; quotes, `or` and `-word` work). Results
        stay in newest-first order, not by relevance. Follow `next` for more.
      summary: List notes, newest first
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: query
        name: page_size
        schema:
          type: integer
        description: 1-100, default 25.
      - in: query
        name: q
        schema:
          type: string
        description: Keywords.
      - in: query
        name: type
        schema:
          type: string
          enum:
          - checklist
          - text
      tags:
      - Notes
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedNoteList'
          description: ''
    post:
      operationId: notes_create
      summary: Create a note
      tags:
      - Notes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/NoteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/NoteRequest'
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
          description: ''
  /api/v1/notes/{id}/:
    get:
      operationId: notes_retrieve
      summary: Get a note
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - Notes
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
          description: ''
    patch:
      operationId: notes_partial_update
      description: 'Send the `version` you loaded, plus the fields you changed. If
        the note has moved on since, nothing is written and you get `409` with the
        current copy: merge, or resend with its version.'
      summary: Change a note
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - Notes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedNoteUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedNoteUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedNoteUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteConflict'
          description: Someone else saved first.
    delete:
      operationId: notes_destroy
      description: 'A soft delete: other devices see it as a tombstone in `changes`.'
      summary: Delete a note
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - Notes
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/notes/{id}/attachments/:
    get:
      operationId: notes_attachments_list
      description: Newest first. Metadata only; download a file with `GET attachments/<id>/file/`.
      summary: List a note's attachments
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - Attachments
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAttachmentList'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: No such note of yours.
    post:
      operationId: notes_attachments_create
      description: |-
        One file in the `file` field of a multipart form: a JPEG, PNG or WebP image, or a PDF, of at most 10 MB. The type is read from the file's bytes; the name and Content-Type sent are not trusted, and a file of any other type is refused with 415 whatever it is called. The name is kept for display and downloads, cleaned, and always ends in the type's extension.

        The same file again on the same note is not stored twice: you get the existing attachment with 200. A new one is 201, `status: pending`. It counts against your `storage_bytes` (see `me/`) until it is deleted. The note is sent again by `notes/changes/` with its attachments.
      summary: Attach a file to a note
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Attachments
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AttachmentUploadRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
          description: Stored.
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
          description: This file is already on the note.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: No file, or an empty one.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: No such note of yours.
        '413':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: '`too_large`: over the cap.'
        '415':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: '`unsupported_file_type`: not a JPEG, PNG, WebP or PDF; or
            `unsupported_media_type`: the request is not multipart.'
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageQuotaExceeded'
          description: '`quota_exceeded`: your storage is full (with usage, in bytes),
            or `throttled`.'
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: '`system_limit_reached`: this feature is paused for everyone
            (a system-wide limit). Not the caller''s own quota; try again later.'
  /api/v1/notes/{id}/format/:
    post:
      operationId: notes_format_create
      description: |-
        Starts restructuring the note (headings, lists, checklists, obvious typos) and returns at once with the job `pending` (202): poll `GET format-jobs/<id>/` until `status` is `done` or `failed`. The note is not changed. A `done` job carries `proposed_content` and the `base_version` it was made from: show it, and on Apply send `PATCH notes/<id>/` with that content and `version = base_version` (a note edited meanwhile is the usual 409).

        A proposal that adds or drops words, numbers or dates is refused: the job fails with `format_changed_content`. A failed job does not count against the month's `format` limit (see `me/`).

        Send a fresh `Idempotency-Key` per request. Resending one (a retry after a dropped connection) returns the job it already made, with 200, and does not count again. Reusing it for another note is a 422.
      summary: Format a note
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: 1-100 of `A-Z a-z 0-9 - _`; a UUID is ideal.
        required: true
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Format
      security:
      - jwtAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormatJob'
          description: Started; poll for the result.
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormatJob'
          description: 'A replayed key: that job.'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: '`note_empty`, `note_too_long`, `idempotency_key_required`
            or `idempotency_key_invalid`.'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: Not signed in.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: No such note of yours.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: '`idempotency_key_reused`: the key was used for another note.'
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormatQuotaExceeded'
          description: '`quota_exceeded` (with usage), or `throttled`.'
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: '`system_limit_reached`: this feature is paused for everyone
            (a system-wide limit). Not the caller''s own quota; try again later.'
  /api/v1/notes/{id}/reminders/:
    post:
      operationId: notes_reminders_create
      description: 'Due at `due_at`, with a heads-up every day for `lead_days` days
        before it, at the same time of day in your timezone: `lead_days + 1` notifications
        in all. At most 20 reminders per note.'
      summary: Add a reminder to a note
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - Reminders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReminderWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReminderWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReminderWriteRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reminder'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
  /api/v1/notes/changes/:
    get:
      operationId: notes_changes_retrieve
      description: 'Every note written after revision `after`, deleted ones included
        as tombstones (no title or content, `deleted_at` set), oldest write first.
        A live note carries all its `reminders` and `attachments` (metadata only);
        adding, changing, finishing or deleting either sends its note again, so replace
        the note''s reminders and attachments with the ones sent. Store `latest_revision`
        and send it as `after` next time. If `has_more` is true, call again straight
        away with it: the batch was cut at `limit`. A first sync sends `after=0`.'
      summary: What changed since a revision
      parameters:
      - in: query
        name: after
        schema:
          type: integer
        description: 'Default 0: everything.'
      - in: query
        name: limit
        schema:
          type: integer
        description: 1-1000, default 500.
      tags:
      - Notes
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteChanges'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
  /api/v1/push/vapid-key/:
    get:
      operationId: push_vapid_key_retrieve
      description: 404 when web push is not configured on this server.
      summary: Web push public key
      tags:
      - Account
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VapidKey'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: Not signed in.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: Web push is off.
  /api/v1/reminders/:
    get:
      operationId: reminders_list
      description: Every reminder with at least one notification in `[from, to)`,
        with those notifications in `occurrences` and its note's title, earliest due
        first. Done reminders are included (`reminder.status` says so). Both bounds
        need an offset (`Z` works; a `+` must be URL-encoded as `%2B`); the range
        is at most 62 days.
      summary: Reminders in a date range (the calendar)
      parameters:
      - in: query
        name: from
        schema:
          type: string
          format: date-time
        required: true
      - in: query
        name: to
        schema:
          type: string
          format: date-time
        required: true
      tags:
      - Reminders
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReminderRange'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
  /api/v1/reminders/{id}/:
    patch:
      operationId: reminders_partial_update
      description: 'Any of `due_at`, `lead_days`, `channels`. Its status stays as
        it is: a done reminder stays done.'
      summary: Change a reminder
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - Reminders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedReminderWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedReminderWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedReminderWriteRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reminder'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
    delete:
      operationId: reminders_destroy
      summary: Delete a reminder
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - Reminders
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/reminders/{id}/done/:
    post:
      operationId: reminders_done_create
      description: Stops the rest of its notifications. Doing it twice is harmless.
      summary: Mark a reminder done
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - Reminders
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reminder'
          description: ''
  /api/v1/search/:
    get:
      operationId: search_list
      description: 'The best-matching chunks of your notes, best first: by meaning
        (embeddings) and by keyword, merged by reciprocal rank fusion, at most 2 per
        note. Deleted notes never appear. A note edited in the last few seconds may
        still match its previous text until it is re-indexed.'
      summary: Search your notes
      parameters:
      - in: query
        name: k
        schema:
          type: integer
        description: 1-20, default 8.
      - in: query
        name: q
        schema:
          type: string
        description: What to find.
        required: true
      tags:
      - Search
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SearchHit'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: Not signed in.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: Too many, too recently.
  /api/v1/session/open/:
    post:
      operationId: session_open_create
      description: 'Sent when the app launches with a valid session, or resumes after
        5 idle hours (D93). Returns the notices to show: `update` when `app_version`
        is older than the latest build (`required` when older than the minimum supported),
        and `memory` when it is due (first open, then every `MEMORY_NOTICE_EVERY_OPENS`
        opens since it was last seen; confirm with `me/memory-notice/seen/`). A repeat
        from the same device within `APP_OPEN_MIN_INTERVAL_SECONDS` is not counted;
        notices come back either way.'
      summary: Report an app open
      tags:
      - Account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionOpenRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SessionOpenRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SessionOpenRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionOpenResponse'
          description: ''
        '400':
          description: Invalid body.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: Not signed in.
components:
  schemas:
    AppVersion:
      type: object
      properties:
        latest:
          type: string
        min_supported:
          type: string
      required:
      - latest
      - min_supported
    AskCreateRequest:
      type: object
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 1000
      required:
      - question
    AskQuery:
      type: object
      description: |-
        An ask (or a conversation turn) as the client shows it.

        Not ``retrieved`` or the token counts: they are for debugging and cost,
        and the scores in ``retrieved`` would invite a client to rank with them.
      properties:
        id:
          type: integer
          readOnly: true
        conversation:
          type: integer
          readOnly: true
          nullable: true
          description: The conversation this is a turn of; null for a plain ask.
        position:
          type: integer
          readOnly: true
          nullable: true
          description: The turn's number in its conversation, from 1; null for a plain
            ask.
        question:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        answer:
          type: string
          readOnly: true
        citations:
          type: array
          items:
            $ref: '#/components/schemas/Citation'
          readOnly: true
          description: 'The notes the answer cites, in first-mention order. Link only
            these numbers: an `[n]` in the answer with no citation points at nothing.'
        error:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        completed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - answer
      - citations
      - completed_at
      - conversation
      - created_at
      - error
      - id
      - position
      - question
      - status
    AskUsage:
      type: object
      description: 'This month''s asks: the `chat_turns` limit. Failed asks are not
        counted.'
      properties:
        used:
          type: integer
        limit:
          type: integer
          nullable: true
          description: 'Null: unlimited.'
        resets_at:
          type: string
          format: date-time
          nullable: true
          description: 'When `used` goes back to 0: the start of next month, Asia/Kolkata.
            Null if it never resets.'
      required:
      - limit
      - resets_at
      - used
    Attachment:
      type: object
      description: |-
        An attachment's metadata, as every endpoint (and ``changes``) returns it.

        Never its bytes (``GET attachments/<id>/file/``) and never its extracted
        text: that is for search, and can be long.
      properties:
        id:
          type: integer
          readOnly: true
        note:
          type: integer
          readOnly: true
        original_name:
          type: string
          readOnly: true
          description: The uploaded file's name, cleaned; always ends in the type's
            extension.
        mime_type:
          type: string
          readOnly: true
          description: Sniffed from the file's bytes, not taken from the upload.
        size:
          type: integer
          readOnly: true
          description: Bytes.
        sha256:
          type: string
