openapi: 3.0.3
info:
  title: Super Notes API
  version: 1.0.0
  description: 'Notes that sync across devices, and answers to questions about them
    with citations. Sign in with `POST /api/v1/auth/google/` and send `Authorization:
    Bearer <access>`.'
paths:
  /api/v1/ask/:
    get:
      operationId: ask_list
      description: Follow `next` for more.
      summary: Your asks, newest first
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: query
        name: page_size
        schema:
          type: integer
        description: 1-100, default 25.
      tags:
      - Ask
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAskQueryList'
          description: ''
    post:
      operationId: ask_create
      description: |-
        Starts answering and returns at once with the ask `pending` (202): poll `GET ask/<id>/` until `status` is `done` or `failed`. The answer comes from your notes only, with `[n]` markers matching `citations`.

        Send a fresh `Idempotency-Key` per question. Resending one (a retry after a dropped connection) returns the ask it already made, with 200, and does not count again. Reusing it for a different question is a 422.

        Each ask that does not fail counts against the month's quota (see `me/`).
      summary: Ask your notes a question
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: 1-100 of `A-Z a-z 0-9 - _`; a UUID is ideal.
        required: true
      tags:
      - Ask
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AskCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AskCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AskCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AskQuery'
          description: Asked; poll for the answer.
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AskQuery'
          description: 'A replayed key: that ask.'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: Invalid question, or `idempotency_key_required` / `idempotency_key_invalid`.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: Not signed in.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: '`idempotency_key_reused`: the key was used for another question.'
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotaExceeded'
          description: '`quota_exceeded` (with usage), or `throttled`.'
  /api/v1/ask/{id}/:
    get:
      operationId: ask_retrieve
      description: Poll this until `status` is `done` or `failed`; a failed ask has
        a user-facing `error` and does not count against the quota.
      summary: Get an ask
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Ask
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AskQuery'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: Not signed in.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: No such ask of yours.
  /api/v1/auth/devices/:
    get:
      operationId: auth_devices_list
      description: 'At most `MAX_SIGNED_IN_DEVICES` (default 2): a further sign-in
        signs the least recently used device out. Most recently seen first; a device
        that has gone away (its refresh token expired or was revoked) is not listed.'
      summary: Signed-in devices
      tags:
      - Account
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Device'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: Not signed in.
  /api/v1/auth/devices/{id}/:
    delete:
      operationId: auth_devices_destroy
      description: Revokes that device's refresh token, so its next refresh is a 401.
        Its current access token keeps working until it expires (`JWT_ACCESS_MINUTES`,
        default 30). Another account's device id is 404.
      summary: Sign a device out
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Account
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: Not signed in.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: No such device of yours.
  /api/v1/auth/google/:
    post:
      operationId: auth_google_create
      description: Verifies the ID token (signature, audience = any configured client
        id, expiry, issuer, verified email), finds or creates the account, and returns
        a token pair. Every refusal is the same `google_failed`, whatever the cause.
      summary: Sign in with Google
      tags:
      - Account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleLoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GoogleLoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GoogleLoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: Google sign-in failed.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: Sign-in is not configured.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: Too many, too recently.
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      description: Blacklists this refresh token. The access token beside it keeps
        working until it expires (`JWT_ACCESS_MINUTES`, default 30); a client should
        drop both.
      summary: Log out
      tags:
      - Account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      security:
      - {}
      responses:
        '204':
          description: No response body
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: Invalid or already revoked.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: Too many, too recently.
  /api/v1/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: 'Exchange a refresh token for a new pair. The old refresh token
        is blacklisted at once: presenting it again is a 401. So is a device that
        was signed out -- from the devices list, or by a newer sign-in once the account
        is on `MAX_SIGNED_IN_DEVICES` devices (default 2): sign in again.'
      summary: Refresh tokens
      tags:
      - Account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshedPair'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: Invalid, expired or revoked.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: Too many, too recently.
  /api/v1/health/:
    get:
      operationId: health_retrieve
      description: |-
        Whether the app is up and can reach its database.

        For an uptime monitor, or a client deciding whether to show "we are
        down". Unauthenticated and unthrottled: a monitor polling once a minute
        would otherwise use up the anonymous rate on its own.
      summary: Health check
      tags:
      - Health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthDown'
          description: ''
  /api/v1/me/:
    get:
      operationId: me_retrieve
      description: The signed-in account.
      summary: Your profile
      tags:
      - Account
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: Not signed in.
  /api/v1/notes/:
    get:
      operationId: notes_list
      description: Deleted notes are left out. `q` is a keyword search over the title
        and body (whole words and their stems; quotes, `or` and `-word` work). Results
        stay in newest-first order, not by relevance. Follow `next` for more.
      summary: List notes, newest first
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: query
        name: page_size
        schema:
          type: integer
        description: 1-100, default 25.
      - in: query
        name: q
        schema:
          type: string
        description: Keywords.
      - in: query
        name: type
        schema:
          type: string
          enum:
          - checklist
          - text
      tags:
      - Notes
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedNoteList'
          description: ''
    post:
      operationId: notes_create
      summary: Create a note
      tags:
      - Notes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/NoteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/NoteRequest'
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
          description: ''
  /api/v1/notes/{id}/:
    get:
      operationId: notes_retrieve
      summary: Get a note
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - Notes
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
          description: ''
    patch:
      operationId: notes_partial_update
      description: 'Send the `version` you loaded, plus the fields you changed. If
        the note has moved on since, nothing is written and you get `409` with the
        current copy: merge, or resend with its version.'
      summary: Change a note
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - Notes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedNoteUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedNoteUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedNoteUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteConflict'
          description: Someone else saved first.
    delete:
      operationId: notes_destroy
      description: 'A soft delete: other devices see it as a tombstone in `changes`.'
      summary: Delete a note
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - Notes
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/notes/changes/:
    get:
      operationId: notes_changes_retrieve
      description: 'Every note written after revision `after`, deleted ones included
        as tombstones (no title or content, `deleted_at` set), oldest write first.
        Store `latest_revision` and send it as `after` next time. If `has_more` is
        true, call again straight away with it: the batch was cut at `limit`. A first
        sync sends `after=0`.'
      summary: What changed since a revision
      parameters:
      - in: query
        name: after
        schema:
          type: integer
        description: 'Default 0: everything.'
      - in: query
        name: limit
        schema:
          type: integer
        description: 1-1000, default 500.
      tags:
      - Notes
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteChanges'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
  /api/v1/search/:
    get:
      operationId: search_list
      description: 'The best-matching chunks of your notes, best first: by meaning
        (embeddings) and by keyword, merged by reciprocal rank fusion, at most 2 per
        note. Deleted notes never appear. A note edited in the last few seconds may
        still match its previous text until it is re-indexed.'
      summary: Search your notes
      parameters:
      - in: query
        name: k
        schema:
          type: integer
        description: 1-20, default 8.
      - in: query
        name: q
        schema:
          type: string
        description: What to find.
        required: true
      tags:
      - Search
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SearchHit'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: Not signed in.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: Too many, too recently.
components:
  schemas:
    AskCreateRequest:
      type: object
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 1000
      required:
      - question
    AskQuery:
      type: object
      description: |-
        An ask as the client shows it.

        Not ``retrieved`` or the token counts: they are for debugging and cost,
        and the scores in ``retrieved`` would invite a client to rank with them.
      properties:
        id:
          type: integer
          readOnly: true
        question:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        answer:
          type: string
          readOnly: true
        citations:
          type: array
          items:
            $ref: '#/components/schemas/Citation'
          readOnly: true
          description: 'The notes the answer cites, in first-mention order. Link only
            these numbers: an `[n]` in the answer with no citation points at nothing.'
        error:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        completed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - answer
      - citations
      - completed_at
      - created_at
      - error
      - id
      - question
      - status
    AskUsage:
      type: object
      description: This month's asks. Failed asks are not counted.
      properties:
        used:
          type: integer
        limit:
          type: integer
        resets_at:
          type: string
          format: date-time
          description: 'When `used` goes back to 0: the start of next month, Asia/Kolkata.'
      required:
      - limit
      - resets_at
      - used
    Citation:
      type: object
      properties:
        n:
          type: integer
          description: The `[n]` marker in the answer this cites.
        note_id:
          type: integer
        chunk_id:
          type: integer
        title:
          type: string
        snippet:
          type: string
          description: The cited passage, on one line, cut at a word.
      required:
      - chunk_id
      - n
      - note_id
      - snippet
      - title
    Device:
      type: object
      description: A signed-in device, as the list shows it. Never its token id.
      properties:
        id:
          type: integer
          readOnly: true
        label:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        last_seen_at:
          type: string
          format: date-time
          readOnly: true
        current:
          type: boolean
          readOnly: true
          description: True for the device making this request, found from the `device`
            claim its access token carries.
      required:
      - created_at
      - current
      - id
      - label
      - last_seen_at
    GoogleLoginRequest:
      type: object
      properties:
        id_token:
          type: string
          minLength: 1
          description: The ID token Google Identity Services (web) or the Android
            sign-in plugin returns.
      required:
      - id_token
    Health:
      type: object
      properties:
        status:
          type: string
      required:
      - status
    HealthDown:
      type: object
      properties:
        status:
          type: string
      required:
      - status
    Me:
      type: object
      description: The signed-in account, as a client shows it.
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        name:
          type: string
          readOnly: true
        avatar_url:
          type: string
          format: uri
          readOnly: true
        plan:
          allOf:
          - $ref: '#/components/schemas/PlanEnum'
          readOnly: true
        date_joined:
          type: string
          format: date-time
          readOnly: true
        ask_usage:
          allOf:
          - $ref: '#/components/schemas/AskUsage'
          readOnly: true
          description: This month's asks, counted from AskQuery rows (assistant/quota.py).
      required:
      - ask_usage
      - avatar_url
      - date_joined
      - email
      - id
      - name
      - plan
    Message:
      type: object
      description: 'A plain answer: what happened, and a stable code a client can
        branch on.'
      properties:
        detail:
          type: string
        code:
          type: string
      required:
      - code
      - detail
    Note:
      type: object
      description: A live note, as every endpoint returns it.
      properties:
        id:
          type: integer
          readOnly: true
        type:
          $ref: '#/components/schemas/TypeEnum'
        title:
          type: string
          maxLength: 500
        content: {}
        content_text:
          type: string
          readOnly: true
        version:
          type: integer
          readOnly: true
        revision:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        deleted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - content_text
      - created_at
      - deleted_at
      - id
      - revision
      - updated_at
      - version
    NoteChange:
      oneOf:
      - $ref: '#/components/schemas/Note'
      - $ref: '#/components/schemas/NoteTombstone'
    NoteChanges:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/NoteChange'
        latest_revision:
          type: integer
        has_more:
          type: boolean
      required:
      - has_more
      - latest_revision
      - results
    NoteConflict:
      type: object
      properties:
        detail:
          type: string
        code:
          type: string
        current:
          $ref: '#/components/schemas/Note'
      required:
      - code
      - current
      - detail
    NoteRequest:
      type: object
      description: A live note, as every endpoint returns it.
      properties:
        type:
          $ref: '#/components/schemas/TypeEnum'
        title:
          type: string
          maxLength: 500
        content: {}
    NoteTombstone:
      type: object
      description: 'A deleted note in ``changes``: enough to drop it, none of its
        content.'
      properties:
        id:
          type: integer
          readOnly: true
        type:
          allOf:
          - $ref: '#/components/schemas/TypeEnum'
          readOnly: true
        version:
          type: integer
          readOnly: true
        revision:
          type: integer
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        deleted_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - deleted_at
      - id
      - revision
      - type
      - updated_at
      - version
    PaginatedAskQueryList:
      type: object
      required:
      - results
      properties:
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cD00ODY%3D"
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cj0xJnA9NDg3
        results:
          type: array
          items:
            $ref: '#/components/schemas/AskQuery'
    PaginatedNoteList:
      type: object
      required:
      - results
      properties:
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cD00ODY%3D"
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cj0xJnA9NDg3
        results:
          type: array
          items:
            $ref: '#/components/schemas/Note'
    PatchedNoteUpdateRequest:
      type: object
      description: 'PATCH: the version the client edited, plus whatever it changed.'
      properties:
        version:
          type: integer
          minimum: 1
          description: The version you loaded. A newer one on the server is a 409.
        type:
          $ref: '#/components/schemas/TypeEnum'
        title:
          type: string
          maxLength: 500
        content: {}
    PlanEnum:
      enum:
      - free
      - premium
      type: string
      description: |-
        * `free` - Free
        * `premium` - Premium
    QuotaExceeded:
      type: object
      description: 'A plain answer: what happened, and a stable code a client can
        branch on.'
      properties:
        detail:
          type: string
        code:
          type: string
        used:
          type: integer
        limit:
          type: integer
        resets_at:
          type: string
          format: date-time
          description: 'When `used` goes back to 0: the start of next month, Asia/Kolkata.'
      required:
      - code
      - detail
      - limit
      - resets_at
      - used
    RefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    RefreshedPair:
      type: object
      properties:
        access:
          type: string
        refresh:
          type: string
          description: The next refresh token. The one sent is now dead.
      required:
      - access
      - refresh
    SearchHit:
      type: object
      description: One matching chunk of a note (retrieval.search.SearchHit), plus
        a snippet.
      properties:
        chunk_id:
          type: integer
        note_id:
          type: integer
        title:
          type: string
        heading_path:
          type: string
          description: The headings above the chunk, "A > B".
        text:
          type: string
          description: The whole chunk.
        snippet:
          type: string
          readOnly: true
          description: The chunk's start, cut at a word.
        score:
          type: number
          format: double
          description: 'Fused rank score: orders the hits, says nothing about relevance
            alone.'
        similarity:
          type: number
          format: double
          nullable: true
          description: Cosine similarity to the query; null if found by keyword only.
        keyword_rank:
          type: number
          format: double
          nullable: true
          description: Full-text rank; null if found by meaning only.
      required:
      - chunk_id
      - heading_path
      - keyword_rank
      - note_id
      - score
      - similarity
      - snippet
      - text
      - title
    StatusEnum:
      enum:
      - pending
      - running
      - done
      - failed
      type: string
      description: |-
        * `pending` - Pending
        * `running` - Running
        * `done` - Done
        * `failed` - Failed
    TokenPair:
      type: object
      properties:
        access:
          type: string
          description: 'Send as `Authorization: Bearer <access>`.'
        refresh:
          type: string
          description: Exchange at `auth/refresh/` for a new pair.
        user:
          $ref: '#/components/schemas/Me'
      required:
      - access
      - refresh
      - user
    TypeEnum:
      enum:
      - text
      - checklist
      type: string
      description: |-
        * `text` - Text
        * `checklist` - Checklist
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
