openapi: 3.0.3
info:
  title: Super Notes API
  version: 1.0.0
  description: 'Notes that sync across devices, and answers to questions about them
    with citations. Sign in with `POST /api/v1/auth/google/` and send `Authorization:
    Bearer <access>`.'
paths:
  /api/v1/auth/devices/:
    get:
      operationId: auth_devices_list
      description: 'At most `MAX_SIGNED_IN_DEVICES` (default 2): a further sign-in
        signs the least recently used device out. Most recently seen first; a device
        that has gone away (its refresh token expired or was revoked) is not listed.'
      summary: Signed-in devices
      tags:
      - Account
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Device'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: Not signed in.
  /api/v1/auth/devices/{id}/:
    delete:
      operationId: auth_devices_destroy
      description: Revokes that device's refresh token, so its next refresh is a 401.
        Its current access token keeps working until it expires (`JWT_ACCESS_MINUTES`,
        default 30). Another account's device id is 404.
      summary: Sign a device out
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Account
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: Not signed in.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: No such device of yours.
  /api/v1/auth/google/:
    post:
      operationId: auth_google_create
      description: Verifies the ID token (signature, audience = any configured client
        id, expiry, issuer, verified email), finds or creates the account, and returns
        a token pair. Every refusal is the same `google_failed`, whatever the cause.
      summary: Sign in with Google
      tags:
      - Account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleLoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GoogleLoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GoogleLoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: Google sign-in failed.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: Sign-in is not configured.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: Too many, too recently.
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      description: Blacklists this refresh token. The access token beside it keeps
        working until it expires (`JWT_ACCESS_MINUTES`, default 30); a client should
        drop both.
      summary: Log out
      tags:
      - Account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      security:
      - {}
      responses:
        '204':
          description: No response body
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: Invalid or already revoked.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: Too many, too recently.
  /api/v1/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: 'Exchange a refresh token for a new pair. The old refresh token
        is blacklisted at once: presenting it again is a 401. So is a device that
        was signed out -- from the devices list, or by a newer sign-in once the account
        is on `MAX_SIGNED_IN_DEVICES` devices (default 2): sign in again.'
      summary: Refresh tokens
      tags:
      - Account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshedPair'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: Invalid, expired or revoked.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: Too many, too recently.
  /api/v1/health/:
    get:
      operationId: health_retrieve
      description: |-
        Whether the app is up and can reach its database.

        For an uptime monitor, or a client deciding whether to show "we are
        down". Unauthenticated and unthrottled: a monitor polling once a minute
        would otherwise use up the anonymous rate on its own.
      summary: Health check
      tags:
      - Health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthDown'
          description: ''
  /api/v1/me/:
    get:
      operationId: me_retrieve
      description: The signed-in account.
      summary: Your profile
      tags:
      - Account
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: Not signed in.
components:
  schemas:
    Device:
      type: object
      description: A signed-in device, as the list shows it. Never its token id.
      properties:
        id:
          type: integer
          readOnly: true
        label:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        last_seen_at:
          type: string
          format: date-time
          readOnly: true
        current:
          type: boolean
          readOnly: true
          description: True for the device making this request, found from the `device`
            claim its access token carries.
      required:
      - created_at
      - current
      - id
      - label
      - last_seen_at
    GoogleLoginRequest:
      type: object
      properties:
        id_token:
          type: string
          minLength: 1
          description: The ID token Google Identity Services (web) or the Android
            sign-in plugin returns.
      required:
      - id_token
    Health:
      type: object
      properties:
        status:
          type: string
      required:
      - status
    HealthDown:
      type: object
      properties:
        status:
          type: string
      required:
      - status
    Me:
      type: object
      description: The signed-in account, as a client shows it.
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        name:
          type: string
          readOnly: true
        avatar_url:
          type: string
          format: uri
          readOnly: true
        plan:
          allOf:
          - $ref: '#/components/schemas/PlanEnum'
          readOnly: true
        date_joined:
          type: string
          format: date-time
          readOnly: true
      required:
      - avatar_url
      - date_joined
      - email
      - id
      - name
      - plan
    Message:
      type: object
      description: 'A plain answer: what happened, and a stable code a client can
        branch on.'
      properties:
        detail:
          type: string
        code:
          type: string
      required:
      - code
      - detail
    PlanEnum:
      enum:
      - free
      - premium
      type: string
      description: |-
        * `free` - Free
        * `premium` - Premium
    RefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    RefreshedPair:
      type: object
      properties:
        access:
          type: string
        refresh:
          type: string
          description: The next refresh token. The one sent is now dead.
      required:
      - access
      - refresh
    TokenPair:
      type: object
      properties:
        access:
          type: string
          description: 'Send as `Authorization: Bearer <access>`.'
        refresh:
          type: string
          description: Exchange at `auth/refresh/` for a new pair.
        user:
          $ref: '#/components/schemas/Me'
      required:
      - access
      - refresh
      - user
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
